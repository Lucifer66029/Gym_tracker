<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="page-header">
    <div class="header-content">
        <button class="back-btn" onclick="goBack()">← Back</button>
        <button class="home-btn" onclick="goHome()">🏠 Home</button>
    </div>
</header>

<div class="container">
    <div class="exercise-header">
        <h1 id="exerciseTitle">Loading Exercise...</h1>
        <button id="editName" class="edit-btn">✏️ Edit Name</button>
    </div>

    <!-- Timer Section -->
    <div class="timer-box">
        <h2>⏱️ Rest Timer</h2>
        <div class="timer-display" id="timerDisplay">01:30</div>
        <div class="timer-controls">
            <button class="timer-btn" id="timerStart">Start</button>
            <button class="timer-btn" id="timerPause">Pause</button>
            <button class="timer-btn" id="timerReset">Reset</button>
        </div>
        <div class="timer-presets">
            <button class="preset-btn" data-time="30">30s</button>
            <button class="preset-btn" data-time="60">1m</button>
            <button class="preset-btn" data-time="90">1:30</button>
            <button class="preset-btn" data-time="120">2m</button>
        </div>
    </div>

    <!-- Sets Counter -->
    <div class="counter-box">
        <h2>📊 Sets</h2>
        <div class="counter-controls">
            <button class="btn dec-btn" id="set-dec">−</button>
            <span class="counter-value" id="set-value">0</span>
            <button class="btn inc-btn" id="set-inc">+</button>
        </div>
        <div class="counter-history">
            <span class="history-label">Today:</span>
            <span id="todaySets">0</span>
            <span class="history-label">Total:</span>
            <span id="totalSets">0</span>
        </div>
    </div>

    <!-- Reps Counter -->
    <div class="counter-box">
        <h2>🔄 Reps</h2>
        <div class="counter-controls">
            <button class="btn dec-btn" id="rep-dec">−</button>
            <span class="counter-value" id="rep-value">0</span>
            <button class="btn inc-btn" id="rep-inc">+</button>
        </div>
        <div class="counter-history">
            <span class="history-label">Today:</span>
            <span id="todayReps">0</span>
            <span class="history-label">Total:</span>
            <span id="totalReps">0</span>
        </div>
    </div>

    <!-- Weight Input -->
    <div class="counter-box">
        <h2>🏋️‍♂️ Weight (kg)</h2>
        <label for="weight-input" class="sr-only">Enter weight in kilograms</label>
        <input id="weight-input" type="number" step="0.1" min="0" placeholder="0.0" class="weight-input">
        <div class="weight-history">
            <span class="history-label">Last:</span>
            <span id="lastWeight">0.0</span>
            <span class="history-label">Best:</span>
            <span id="bestWeight">0.0</span>
        </div>
    </div>

    <!-- Notes Section -->
    <div class="notes-box">
        <h2>📝 Notes</h2>
        <textarea id="exerciseNotes" placeholder="Add notes about this exercise (form, tips, how it felt...)"></textarea>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
        <button id="saveSession" class="save-btn">💾 Save Session</button>
        <button id="reset" class="reset-btn">🔄 Reset Counters</button>
        <button id="viewHistory" class="history-btn">📊 View History</button>
    </div>

    <!-- Stats Summary -->
    <div class="stats-box" id="statsBox">
        <h3>📈 Session Summary</h3>
        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-label">Volume</span>
                <span class="stat-value" id="volumeStat">0 kg</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Sets × Reps</span>
                <span class="stat-value" id="totalRepsStat">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Time</span>
                <span class="stat-value" id="timeStat">0m</span>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
